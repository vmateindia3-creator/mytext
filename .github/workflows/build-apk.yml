name: Build APK

# Builds an installable Android APK and attaches it to the run, so you can
# download it without installing Flutter or the Android SDK locally.
#
# Where to find it:  Actions tab -> the "Build APK" run -> "Artifacts" -> mytext-apk
#
# You can also build by hand, and point the app at your own server at the same
# time:  Actions -> Build APK -> "Run workflow" -> paste your backend URL.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL the app should talk to (e.g. https://mytext-server.onrender.com)'
        required: false
        default: 'http://10.0.2.2:4000'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: |
          API_URL="${{ github.event.inputs.api_url || 'http://10.0.2.2:4000' }}"
          echo "Building for backend: $API_URL"
          flutter build apk --release --dart-define=MYTEXT_API_URL="$API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mytext-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
