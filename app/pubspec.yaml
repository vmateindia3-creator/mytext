name: mytext
description: "Mytext — a fast, simple messaging app. 1:1 chat, groups, media and calls."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # Local storage
  shared_preferences: ^2.2.3

  # Media picking
  image_picker: ^1.1.2
  file_picker: ^8.0.5

  # Voice / video calls
  flutter_webrtc: ^0.12.12

  # End-to-end encryption
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # Formatting
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
