# Local development stack: MongoDB + the WaveChat API.
# Usage:  docker compose up -d mongo     (just the database)
#         docker compose up              (database + server)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/wavechat
      JWT_SECRET: change-me-in-production
      PUBLIC_URL: http://localhost:4000
      CORS_ORIGIN: '*'
    ports:
      - '4000:4000'

volumes:
  mongo_data:
